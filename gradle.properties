# Gradle configuration for Pilcrow
android.useAndroidX=true
kotlin.code.style=official

# Larger heap for the Gradle daemon — material-icons-extended generates a very
# large class set and OOMs the default 512m heap during compilation.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
