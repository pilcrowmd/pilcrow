name: CI

# Quality gate for PilcrowMD. Runs on every push + PR to main.
#
# Kotlin is pinned to 2.3.10 to match the metadata version of the Sora editor dependency
# (editor-bom:0.24.5). That toolchain carries a known incremental-compiler quirk that can cache a
# stale state and emit phantom "Unresolved reference" errors on valid code — a false negative,
# never a false pass. So CI builds from a clean state (the mandatory, separate `clean` step) and
# `--rerun-tasks` defeats Gradle task-output caching; a from-scratch compile is the only result we
# trust.

# PATH FILTERING — why a docs-only change does not build the app.
# This gate is ~11 minutes of compile, lint, unit tests, Roborazzi and R8. A commit that touches
# only prose cannot change any of those results, so running it proves nothing and bills the time
# twice (once on the PR, once on the merge commit). PR #145 — 128 lines of `docs/MAINTENANCE.md` —
# cost 24 billed minutes to tell us the app still compiled.
#
# MEASURED, NOT ASSUMED: no Gradle task and no test reads `docs/**.md` or a root `*.md`. The
# licence assets that `bundleRelease` packages come from `app/src/main/assets/licenses` and
# `open_source_licenses.json`, NOT from the root `LICENSES.md`; the markdown fixtures the tests do
# read all live under `app/src/**` and are deliberately NOT ignored here. Re-run that check before
# widening these patterns — the moment a `.md` under these paths becomes a build input, this filter
# starts hiding real failures.
#
# It applies to `push` as well as `pull_request` on purpose: the merge commit of a docs-only PR has
# the same property as the PR did, and it was the single largest remaining docs cost. `main` stays
# releasable because the last commit that could affect the build is still the last one this gate
# ran on.
#
# `.github/workflows/**` is NOT ignored, so a change to this file still builds — including the PR
# that introduced the filter.
#
# BOTH GLOB SPELLINGS ARE LISTED ON PURPOSE — it is not redundancy.
# Whether `docs/**.md` matches NESTED markdown depends on how GitHub's matcher treats `**` when it
# is not a whole path segment: as "any character, slashes included" it matches `docs/a/b.md`; under
# minimatch's stricter reading it degrades to `docs/*.md` and nested files would keep triggering
# 11-minute builds. I could not settle that from the outside, and simulating it only re-encoded my
# own assumption — a test whose oracle is the belief under test proves nothing. `paths-ignore` is a
# UNION, so listing `docs/**/*.md` as well is correct under EITHER reading, which beats betting on
# one. Safe to widen because it is already established that nothing under `docs/` is a build input.
#
# THE LATENT TRAP, recorded because it is invisible until the day it bites: if the `CI` check ever
# becomes REQUIRED in branch protection or a repository ruleset, a skipped run leaves that check
# pending for ever and no docs PR can merge again. Verified on 2026-09-18 that `main` has neither
# (`/branches/main/protection` → 404 "Branch not protected", `/rulesets` → `[]`), which is the only
# reason this simple form is safe. Turning protection on means adding an always-run job that
# reports the required name — do that in the same change, not afterwards.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**.md'
      - 'docs/**/*.md'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**.md'
      - 'docs/**/*.md'
      - '*.md'

# CONCURRENCY — one live run per branch, superseded runs stop.
# Without this, three pushes in a row to a PR bill three full ~11-minute builds and only the last
# one is ever read. PR #144 ran the gate SIX times for 57.4 billed minutes; five of those were
# already obsolete when they finished.
#
# `cancel-in-progress` is deliberately an expression, not `true`: a run on `push` to `main` must
# always finish, because `main` is the live release line and its build result is the thing the
# release is cut from. Only `pull_request` runs — which are re-run from scratch on the next push
# anyway — are cancellable. `github.ref` is `refs/pull/<n>/merge` for a PR and `refs/heads/main`
# for a push, so the two never share a group.
#
# THE GROUP KEY IS NOT `github.ref`, AND THAT IS THE LOAD-BEARING PART.
# `cancel-in-progress: false` stops a RUNNING job being cancelled. It does NOT stop a PENDING one:
# GitHub allows exactly one pending run per concurrency group, and a newly queued run CANCELS the
# one already waiting. Keying `main` pushes on `refs/heads/main` would put them all in one group, so
# three merges in quick succession would silently drop the middle run's build entirely — the precise
# opposite of the guarantee above. Not hypothetical here: PR #145 and PR #146 merged EIGHT SECONDS
# apart, so the queue is real and a third merge would have hit it.
# Keying pushes on `github.run_id` instead makes every push its own group, so main runs never queue
# against each other and none can be dropped. Pull requests keep `github.ref`
# (`refs/pull/<n>/merge`), which is what lets a newer push cancel the obsolete run.
# With the group unique per push, `cancel-in-progress` is belt-and-braces for `push` rather than the
# protection — it is kept because it states the intent where a reader looks, but if you ever change
# the group expression, THAT is what you are changing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Pinned to an immutable runner image (not the floating `ubuntu-latest`) for reproducible CI.
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to immutable commit SHAs (supply-chain hardening); the
      # trailing comment records the human-readable version each SHA corresponds to.
      # NODE 24: every action below was verified to declare `runs.using: node24` in its action.yml
      # at the exact SHA pinned here, read from the live repository rather than assumed. GitHub
      # removes Node.js 20 from runners on 2026-09-16. When bumping again, re-read `runs.using` at
      # the candidate SHA — the version number alone does not tell you the runtime, and the v4 lines
      # of checkout and setup-java were still node20 at their newest releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # HELD AT v5 BY OWNER DECISION — do not "modernise" this to v6.
      # gradle/actions@v6.0.0 moved the caching component into a separate `gradle-actions-caching`
      # library that is NO LONGER OPEN-SOURCE, and its release notes state that upgrading
      # constitutes acceptance of Gradle's Terms of Use for that component.
      # This file is part of the published source tree, so bumping to v6 would land a closed-source
      # dependency and an implicit Terms-of-Use acceptance in a GPL-3 project whose central trust
      # claim is a reproducible build that F-Droid's own CI verifies against the published APK.
      # v5.0.2 is the newest v5 release, already runs on node24, and carries none of that — it meets
      # the 2026-09-16 Node 24 deadline with no licensing commitment attached.
      # REVISIT ONLY IF THE v5 LINE LOSES SUPPORT.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Clean (mandatory — defeats the Kotlin 2.3.10 incremental-cache bug)
        run: ./gradlew clean

      # The gate also exercises the RELEASE variant: bundleRelease builds the upload .aab
      # (release manifest merge + license/SPDX asset wiring + packaging), and lintRelease runs
      # Android lint on the release variant. The Play upload is a release .aab, so a release-only
      # break must fail CI here, not Play review. No upload keystore exists in CI (and must not):
      # app/build.gradle.kts leaves the release signingConfig null when no keystore is configured,
      # so bundleRelease here produces an UNSIGNED bundle. The signed upload build stays a local step.
      # Kept in this one job so the single mandatory clean step + --rerun-tasks cover both variants
      # (the Kotlin 2.3.10 cache-bug rule) without duplicating checkout/JDK/Gradle setup.
      - name: Build, lint, unit tests, screenshot gate (debug + release variant)
        run: ./gradlew assembleDebug ktlintCheck detekt testDebugUnitTest testMainDispatcherDebug verifyRoborazziDebug bundleRelease lintRelease --rerun-tasks

      # Without this, a CI-only failure is undiagnosable. A failing test's assertion MESSAGE (the
      # string awaitValue/assertEquals was given) exists only in the HTML/XML report — the Gradle
      # console prints just "AssertionError at SomeTest.kt:NN". When several assertions share one
      # line (a polling helper's final assertEquals is the usual case) the console cannot tell you
      # WHICH one fired, so the failure teaches nothing and the next occurrence teaches nothing
      # again. This happened: PR #53, a docs-only commit, failed MarkdownViewModelRenderModeTest and
      # left no way to separate a too-tight timeout budget from a logic race.
      # Roborazzi's compare/diff images are included for the same reason — a golden mismatch on CI
      # is unreadable without the actual/diff PNGs.
      # Runs only on failure, so a green build pays nothing. Already on node24 — this pin was
      # unchanged by the Node 24 sweep; keep the SHA pin and update the version comment with it.
      - name: Upload test + lint reports (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testMainDispatcherDebug/**
            app/build/test-results/testMainDispatcherDebug/**
            app/build/reports/roborazzi/**
            app/build/outputs/roborazzi/**
            app/build/reports/lint-results-release.*
          retention-days: 14
          if-no-files-found: ignore
