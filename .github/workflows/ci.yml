name: CI

# Quality gate for Pilcrow. Runs on every push + PR to main.
#
# Kotlin is pinned to 2.3.10 to match the metadata version of the Sora editor dependency
# (editor-bom:0.24.5). That toolchain carries a known incremental-compiler quirk that can cache a
# stale state and emit phantom "Unresolved reference" errors on valid code — a false negative,
# never a false pass. So CI builds from a clean state (the mandatory, separate `clean` step) and
# `--rerun-tasks` defeats Gradle task-output caching; a from-scratch compile is the only result we
# trust.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Pinned to an immutable runner image (not the floating `ubuntu-latest`) for reproducible CI.
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to immutable commit SHAs (supply-chain hardening); the
      # trailing comment records the human-readable version each SHA corresponds to.
      # NODE 24: every action below was verified to declare `runs.using: node24` in its action.yml
      # at the exact SHA pinned here, read from the live repository rather than assumed. GitHub
      # removes Node.js 20 from runners on 2026-09-16. When bumping again, re-read `runs.using` at
      # the candidate SHA — the version number alone does not tell you the runtime, and the v4 lines
      # of checkout and setup-java were still node20 at their newest releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # HELD AT v5 BY OWNER DECISION — do not "modernise" this to v6.
      # gradle/actions@v6.0.0 moved the caching component into a separate `gradle-actions-caching`
      # library that is NO LONGER OPEN-SOURCE, and its release notes state that upgrading
      # constitutes acceptance of Gradle's Terms of Use for that component.
      # This file is part of the published source tree, so bumping to v6 would land a closed-source
      # dependency and an implicit Terms-of-Use acceptance in a GPL-3 project whose central trust
      # claim is a reproducible build that F-Droid's own CI verifies against the published APK.
      # v5.0.2 is the newest v5 release, already runs on node24, and carries none of that — it meets
      # the 2026-09-16 Node 24 deadline with no licensing commitment attached.
      # REVISIT ONLY IF THE v5 LINE LOSES SUPPORT.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Clean (mandatory — defeats the Kotlin 2.3.10 incremental-cache bug)
        run: ./gradlew clean

      # The gate also exercises the RELEASE variant: bundleRelease builds the upload .aab
      # (release manifest merge + license/SPDX asset wiring + packaging), and lintRelease runs
      # Android lint on the release variant. The Play upload is a release .aab, so a release-only
      # break must fail CI here, not Play review. No upload keystore exists in CI (and must not):
      # app/build.gradle.kts leaves the release signingConfig null when no keystore is configured,
      # so bundleRelease here produces an UNSIGNED bundle. The signed upload build stays a local step.
      # Kept in this one job so the single mandatory clean step + --rerun-tasks cover both variants
      # (the Kotlin 2.3.10 cache-bug rule) without duplicating checkout/JDK/Gradle setup.
      - name: Build, lint, unit tests, screenshot gate (debug + release variant)
        run: ./gradlew assembleDebug ktlintCheck detekt testDebugUnitTest testMainDispatcherDebug verifyRoborazziDebug bundleRelease lintRelease --rerun-tasks

      # Without this, a CI-only failure is undiagnosable. A failing test's assertion MESSAGE (the
      # string awaitValue/assertEquals was given) exists only in the HTML/XML report — the Gradle
      # console prints just "AssertionError at SomeTest.kt:NN". When several assertions share one
      # line (a polling helper's final assertEquals is the usual case) the console cannot tell you
      # WHICH one fired, so the failure teaches nothing and the next occurrence teaches nothing
      # again. This happened: PR #53, a docs-only commit, failed MarkdownViewModelRenderModeTest and
      # left no way to separate a too-tight timeout budget from a logic race.
      # Roborazzi's compare/diff images are included for the same reason — a golden mismatch on CI
      # is unreadable without the actual/diff PNGs.
      # Runs only on failure, so a green build pays nothing. Already on node24 — this pin was
      # unchanged by the Node 24 sweep; keep the SHA pin and update the version comment with it.
      - name: Upload test + lint reports (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testMainDispatcherDebug/**
            app/build/test-results/testMainDispatcherDebug/**
            app/build/reports/roborazzi/**
            app/build/outputs/roborazzi/**
            app/build/reports/lint-results-release.*
          retention-days: 14
          if-no-files-found: ignore
