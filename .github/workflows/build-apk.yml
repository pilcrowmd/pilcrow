name: Build APK

# Builds a debug APK on the confirm-before-exit feature branch and publishes it as a
# release asset for sideload verification of issue #20.

on:
  push:
    branches: [cursor/confirm-before-exit-0d3a]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Clean + assembleDebug
        run: ./gradlew clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PilcrowMD-confirm-before-exit-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="PilcrowMD-confirm-before-exit-debug.apk"
          cp "$APK_SRC" "$APK_OUT"
          TAG="confirm-before-exit"
          TITLE="Confirm before exit debug APK"
          NOTES="Debug APK for issue #20 (Confirm before exit). Built from branch cursor/confirm-before-exit-0d3a @ ${GITHUB_SHA}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_OUT" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_OUT" --title "$TITLE" --notes "$NOTES"
          fi
