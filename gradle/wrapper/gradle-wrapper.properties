distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
# SHA-256 of the distribution above, so the wrapper verifies CONTENTS and not just the URL.
# Published at https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256 and on
# https://gradle.org/release-checksums/ — both checked, and they agree.
# Re-pin whenever distributionUrl moves; a stale sum fails EVERY wrapper invocation, including
# the F-Droid buildserver's, so change the two lines together and let CI confirm.
distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
